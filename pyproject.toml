[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".git", "venv", "runtime", "blacklist"]

[tool.ruff.lint]
# Conjunto base de Ruff: errores de pycodestyle (E4, E7, E9) y Pyflakes (F).
# Se ignoran solo reglas que el código ya incumple, para que el lint pase
# sin reescribir la aplicación:
#   E402 — imports tardíos a propósito (ids.py fija el consentimiento antes de config)
#   E741 — variable `l` en generadores
#   F401 — imports sin uso
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E741", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
