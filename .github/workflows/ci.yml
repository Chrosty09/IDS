name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# contents: leer el repo. actions: subir el artefacto del job de empaquetado.
permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar (lint, sintaxis y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint con Ruff
        run: ruff check .

      - name: Comprobar sintaxis
        run: python -m compileall -q -f ids.py gui.py config.py reset_prueba.py modulos utils tests

      - name: Ejecutar pruebas
        run: pytest

  empaquetar:
    name: Empaquetar artefacto
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Crear zip del código fuente
        run: |
          git archive --format=zip --prefix="ids/" -o ids-fuente.zip HEAD
          unzip -t ids-fuente.zip > /dev/null

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: ids-fuente
          path: ids-fuente.zip
          if-no-files-found: error
          retention-days: 14
